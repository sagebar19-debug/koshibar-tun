
name: KOSHIBAR TUN - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

permissions:
  contents: read

jobs:
  android:
    name: Compiler KOSHIBAR TUN
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android 35
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Trouver le projet Android
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f application/settings.gradle ]; then
            echo "dir=application" >> "$GITHUB_OUTPUT"
          else
            echo "ERREUR: settings.gradle introuvable"
            exit 1
          fi

      - name: Compiler APK Debug
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: KOSHIBAR-TUN-ANDROID
          path: |
            app/build/outputs/apk/debug/*.apk
            application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
