name: Build VPN App APK

on:
  push:
    branches: [ main, master, principal ]
  pull_request:
    branches: [ main, master, principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: ☕ Configurer Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Configurer Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x gradlew

    - name: 🔨 Compiler l'APK (Debug avec logs détaillés)
      run: ./gradlew assembleDebug --stacktrace --info

    - name: 📦 Sauvegarder l'APK généré
      uses: actions/upload-artifact@v4
      with:
        name: Koshibar-Tun-APK
        path: app/build/outputs/apk/debug/app-debug.apk
