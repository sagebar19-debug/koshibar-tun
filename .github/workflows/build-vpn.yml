name: Build KOSHIBAR TUN APK

on:
  push:
    branches:
      - main
      - master
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK et accepter les licences
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0 cmdline-tools;latest'

      - name: Compiler KOSHIBAR TUN
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: KOSHIBAR-TUN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
