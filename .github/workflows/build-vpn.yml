name: Build KOSHIBAR TUN APK

on:
  push:
    branches:
      - main
      - master
      - principal
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmdline-tools;latest'

      - name: Installer les composants Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verifier le Manifest XML
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"

          print("Fichier present :", os.path.exists(path))

          if not os.path.exists(path):
              raise SystemExit("ERREUR : AndroidManifest.xml introuvable")

          with open(path, "rb") as f:
              contenu = f.read()

          print("Taille :", len(contenu), "octets")
          print("Debut du fichier :", repr(contenu[:100]))

          try:
              ET.fromstring(contenu)
              print("SUCCES : XML valide")
          except ET.ParseError as e:
              print("ERREUR XML :", e)
              raise
          PY

      - name: Compiler KOSHIBAR TUN
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: KOSHIBAR-TUN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
