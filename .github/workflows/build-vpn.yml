
name: Build VPN App APK

on:
  push:
    branches:
      - main
      - master
      - principal
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verifier les fichiers Android
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/koshibar/tun/MainActivity.java
          test -f app/src/main/java/com/koshibar/tun/KoshibarVpnService.java
          test -f app/src/main/assets/KOSHIBAR_TUN.html

      - name: Compiler KOSHIBAR TUN
        run: gradle --no-daemon assembleDebug

      - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: KOSHIBAR-TUN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
