name: Build VPN App APK

on:
  push:
    branches: [ main, master, principal ]
  pull_request:
    branches: [ main, master, principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: ☕ Configurer Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Télécharger et configurer Gradle Wrapper
      run: |
        gradle -v || true
        # Téléchargement d'un gradle wrapper standard si absent
        if [ ! -f "gradlew" ]; then
          mvn_or_gradle_version="8.5"
          wget https://services.gradle.org/distributions/gradle-${mvn_or_gradle_version}-bin.zip
          unzip -q gradle-${mvn_or_gradle_version}-bin.zip
          gradle-${mvn_or_gradle_version}/bin/gradle wrapper --gradle-version ${mvn_or_gradle_version}
        fi
        chmod +x gradlew

    - name: 🔨 Compiler l'APK (Debug)
      run: ./gradlew assembleDebug

    - name: 📦 Sauvegarder l'APK généré
      uses: actions/upload-artifact@v4
      with:
        name: Koshibar-Tun-APK
        path: app/build/outputs/apk/debug/app-debug.apk
